<!doctype html>
<html lang="sk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ziegermill Flats</title>
<style>
/* Ziegermill visual identity V3 (Buy Now Studio, 9/2026): Neutral ground, white building, Orange as the highlight laid over
   the architecture (as the orange bars over the render in the manual), Dark for text, Google Sans. One committed light look. */
@font-face { font-family: "Google Sans"; src: url("fonts/GoogleSans-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Google Sans"; src: url("fonts/GoogleSans-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Google Sans"; src: url("fonts/GoogleSans-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
:root {
  --zm-orange: #ffa62b;
  --zm-dark: #544740;
  --zm-neutral: #d6d9c7;
  --zm-blue: #3091b2;
  --zm-accent: #04318c;
  --zm-black: #231f20;
  --bg: var(--zm-neutral);
  --ink: var(--zm-black);
  --ink-dim: #6f655e;
  --paper: rgba(250, 250, 246, 0.84);
  --paper-strong: rgba(250, 250, 246, 0.96);
  --line: rgba(84, 71, 64, 0.18);
  --hi: var(--zm-orange);
  --free: var(--zm-blue);
  --held: var(--zm-orange);
  --sold: var(--zm-dark);
  --nodata: var(--zm-accent);
  --rest: #a9ab9f;
  --ui: "Google Sans", "Product Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); overflow: hidden; -webkit-user-select: none; user-select: none; }
#view { position: fixed; inset: 0; touch-action: none; }
#view canvas { display: block; width: 100%; height: 100%; outline: none; }
.chip { background: var(--paper); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 4px; }
#brand { position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); padding: 12px 14px; display: grid; background: var(--zm-dark); border: 0; max-width: calc(100vw - 32px); }
#brand svg { width: 168px; height: auto; display: block; }
#hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 8px 12px; font-size: 13px; transition: opacity .6s; text-align: center; max-width: calc(100vw - 32px); }
#hint.gone { opacity: 0; pointer-events: none; }
#tip { position: fixed; left: 0; top: 0; padding: 7px 10px 8px; pointer-events: none; transform: translate(14px, -50%); white-space: nowrap; font-size: 13px; background: var(--paper-strong); }
#tip b { font-weight: 700; }
#tip .st { color: var(--ink-dim); margin-left: 8px; }
#card { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(340px, calc(100vw - 32px)); padding: 0 0 14px; display: grid; gap: 12px; background: var(--paper-strong); overflow: hidden; }
#card .band { height: 6px; background: var(--hi); }
#card > :not(.band) { margin-inline: 16px; }
#card h2 { margin: 0; font-weight: 500; font-size: 28px; line-height: 1.05; letter-spacing: -0.01em; text-wrap: balance; }
#card .meta { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.06em; text-transform: uppercase; }
#card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
#card dt { color: var(--ink-dim); }
#card dd { margin: 0; font-variant-numeric: tabular-nums; }
#card .pill { display: inline-block; padding: 3px 8px; border-radius: 2px; font-size: 12px; font-weight: 500; color: #fff; background: var(--nodata); }
#card .note { font-size: 12px; color: var(--ink-dim); line-height: 1.4; }
#card .row { display: flex; gap: 8px; flex-wrap: wrap; }
#card a, #card button { font: 500 14px/1 var(--ui); border-radius: 2px; padding: 12px 14px; cursor: pointer; text-decoration: none; border: 1px solid var(--line); color: var(--ink); background: transparent; }
#card a.go { background: var(--zm-orange); color: var(--zm-black); border-color: var(--zm-orange); }
#card a:focus-visible, #card button:focus-visible, #loader { position: fixed; inset: 0; display: grid; place-items: center; background: var(--zm-dark); transition: opacity .5s; z-index: 5; }
#loader.done { opacity: 0; pointer-events: none; }
#loader .box { display: grid; gap: 16px; justify-items: center; font-size: 13px; color: var(--zm-neutral); }
#loader svg { width: 220px; height: auto; }
#loader .bar { width: 180px; height: 2px; background: rgba(214, 217, 199, 0.25); overflow: hidden; }
#loader .bar i { display: block; height: 100%; width: 0; background: var(--zm-orange); transition: width .2s; }
#orbit { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 112px; height: 112px; border-radius: 50%; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
#orbit svg { display: block; width: 100%; height: 100%; }
#orbit .ring { fill: none; stroke: var(--line); stroke-width: 1; }
#orbit .pad { fill: rgba(84, 71, 64, 0.06); cursor: grab; }
#orbit .pad:active { cursor: grabbing; }
#orbit .arr { fill: var(--zm-dark); cursor: pointer; }
#orbit .arr:hover, #orbit .arr.on { fill: var(--zm-orange); }
#orbit .needle { fill: var(--zm-orange); }
#orbit .hit { fill: transparent; cursor: pointer; }
#card { z-index: 2; }
@media (max-width: 560px) {
  #brand svg { width: 132px; }
  #hint { bottom: auto; top: calc(96px + env(safe-area-inset-top, 0px)); }
  #card { right: 16px; left: 16px; width: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  #orbit { width: 104px; height: 104px; }
}
@media (prefers-reduced-motion: reduce) { #hint, #loader, #loader .bar i { transition: none; } }
#back { position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); z-index: 3; display: flex; align-items: center; gap: 6px; padding: 9px 14px 9px 10px; font: 500 13px/1 var(--ui); color: var(--ink); background: var(--paper); cursor: pointer; }
#back:hover, #back:focus-visible { background: var(--paper-strong); outline: none; }
</style>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (id) => document.getElementById(id);
// Every flat and atelier comes with the model (FLAT_<id> volumes, outlined from the ASR floor plans; name, kind, floor and
// plan area ride along as glTF extras). Price and status come from the sales site's database (/api/units) once the
// units are entered there. WALK: the walkthroughs that exist, as folders next to this one.
const WALK = { a32: '../a32/index.html', a25: '../a25/index.html', byt01: '../byt01/index.html' };
const FLATS = {};
const STATUS = { available: ['voľný', '--free'], reserved: ['rezervovaný', '--held'], sold: ['predaný', '--sold'] };
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const touch = matchMedia('(pointer: coarse)').matches;
if (touch) $('hint').textContent = 'Ťuknite na byt · otáčate prstom alebo ovládačom vľavo dole, dvoma prstami približujete';

// ---------------------------------------------------------------- scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, touch ? 2 : 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NoToneMapping;   // 8 Oct (Jano): no filmic curve - materials show their own colour, not washed out
renderer.shadowMap.enabled = false;
$('view').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(css('--zm-neutral'));
scene.fog = new THREE.Fog(new THREE.Color(css('--zm-neutral')), 180, 460);
const camera = new THREE.PerspectiveCamera(touch ? 50 : 40, innerWidth / innerHeight, 0.5, 2000);
// 8 Oct (Jano): even light from every side, no shadows - a soft sky dome plus four equal lights from the four diagonals
// and one from above, so every facade reads the same while the edges and depths of the building still show
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d9d2, 1.26));   // light from below too, so ceilings read as white as the walls
for (const [x, z] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
  const l = new THREE.DirectionalLight(0xffffff, 0.52); l.position.set(x * 100, 70, z * 100); scene.add(l);
}
const top = new THREE.DirectionalLight(0xffffff, 0.3); top.position.set(0, 100, 0); scene.add(top);
const ground = new THREE.Mesh(new THREE.CircleGeometry(400, 64), new THREE.MeshStandardMaterial({ color: 0xc4c7b4, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.5; scene.add(ground);   // replaced by the model's own Ground
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = Math.PI * 0.47; controls.minDistance = 12; controls.maxDistance = 220;
controls.enablePan = false;            // 8 Oct (Jano): rotate and zoom only - always around building A (B is not for sale)

// ---------------------------------------------------------------- the model: building + one volume per flat
const draco = new DRACOLoader().setDecoderPath('draco/');
const loader = new GLTFLoader().setDRACOLoader(draco);
const vols = [];             // { id, mesh (pick), fill, edges, box }
// building.glb, or the same bytes embedded as base64 (window.__GLB, from building.glb.js) where .glb files can't be served
function loadGLB(onLoad, onProgress, onError) {
  if (!window.__GLB) return loader.load('building.glb', onLoad, onProgress, onError);
  const bin = atob(window.__GLB), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  loader.parse(buf.buffer, '', onLoad, onError);
}
loadGLB((g) => {
  const root = g.scene; scene.add(root);
  const meshes = []; root.traverse((o) => { if (o.isMesh) meshes.push(o); });   // collect first: addFlat detaches meshes
  meshes.forEach((o) => {
    const fid = (o.userData && o.userData.flat) || (o.name.startsWith('FLAT_') ? o.name.slice(5) : null);
    if (fid) { addFlat(fid, o); return; }
    const ms = Array.isArray(o.material) ? o.material : [o.material];
    ms.forEach((m) => { m.side = THREE.DoubleSide; if (m.transparent) m.depthWrite = false; });
  });
  if (root.getObjectByName('Ground')) scene.remove(ground);
  // orbit centre: the middle of building A = the box around all the flats, from the ground up
  const box = new THREE.Box3(); vols.forEach((v) => { v.geo.computeBoundingBox(); box.union(v.geo.boundingBox); });
  box.min.y = 0; const c = box.getCenter(new THREE.Vector3()); const s = box.getSize(new THREE.Vector3());
  controls.target.copy(c);
  const R = Math.max(s.x, s.y, s.z); controls.minDistance = R * 0.8; controls.maxDistance = R * 4;
  camera.position.copy(c).add(new THREE.Vector3(-0.35, 0.38, 1).normalize().multiplyScalar(R * (touch ? 2.6 : 2.1)));
  controls.update();
  loadUnits(); $('loader').classList.add('done');
}, (e) => { if (e.total) $('bar').style.width = Math.round(100 * e.loaded / e.total) + '%'; },
(err) => { $('msg').textContent = 'Model budovy sa nepodarilo načítať. Skúste stránku obnoviť.'; console.error(err); });

function addFlat(id, mesh) {
  mesh.updateMatrixWorld(true);
  const geo = mesh.geometry.clone().applyMatrix4(mesh.matrixWorld);
  const d = mesh.userData || {};
  mesh.parent.remove(mesh);
  FLATS[id] = { name: d.name || id, kind: d.kind || '', floor: +d.floor || 0, area: +d.area || 0, walk: WALK[id] || null, unit: null };
  // at rest: a light-grey dotted outline seen through the building; under the pointer / when picked: the X-ray -
  // the volume filled in Ziegermill Orange (the manual's highlight over the architecture) with a solid outline
  const eg = new THREE.EdgesGeometry(geo, 25);
  const dots = new THREE.LineSegments(eg, new THREE.LineDashedMaterial({ color: css('--rest'), dashSize: 0.18, gapSize: 0.22, transparent: true, opacity: 0.9, depthTest: false, toneMapped: false }));
  dots.computeLineDistances(); dots.renderOrder = 9;
  const fill = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: css('--hi'), transparent: true, opacity: 0.5, depthTest: false, depthWrite: false, toneMapped: false }));
  fill.renderOrder = 10; fill.visible = false;
  const edges = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({ color: css('--zm-black'), depthTest: false, toneMapped: false }));
  edges.renderOrder = 11; edges.visible = false;
  scene.add(dots, fill, edges);
  geo.computeBoundingBox(); const center = geo.boundingBox.getCenter(new THREE.Vector3());
  vols.push({ id, dots, fill, edges, geo, center, floor: FLATS[id].floor, on: true });
}
const floorName = (n) => n + '. podlažie';

const floorSel = null;

// ---------------------------------------------------------------- price / status from the sales site (when it serves them)
async function loadUnits() {
  try {
    const r = await fetch('/api/units', { cache: 'no-store' }); if (!r.ok) throw 0;
    const units = await r.json();
    for (const [id, f] of Object.entries(FLATS)) f.unit = units.find((u) => String(u.id).toLowerCase() === id || u.name === f.name) || null;
  } catch (_) { /* no database here: the card says the price is coming */ }
  paint();
}
function statusOf(id) { const u = FLATS[id] && FLATS[id].unit; return u && STATUS[u.status] ? u.status : null; }

let hover = null, picked = null;
const showOutlines = false;   // 8 Oct (Jano): no outlines at rest - a flat shows only under the pointer or when picked
function paint() {
  for (const v of vols) {
    v.on = !floorSel || v.floor === floorSel;
    const hot = v.on && (v.id === hover || v.id === picked);
    v.dots.visible = showOutlines && v.on && !hot; v.fill.visible = v.edges.visible = hot;
  }
}

// ---------------------------------------------------------------- picking: hover (mouse), tap / click (card)
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(x, y) {
  ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(vols.filter((v) => v.on).map((v) => v.fill), false);
  return hits.length ? vols.find((v) => v.fill === hits[0].object).id : null;
}
const tip = $('tip');
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  const id = pick(e.clientX, e.clientY);
  if (id !== hover) { hover = id; paint(); renderer.domElement.style.cursor = id ? 'pointer' : ''; }
  if (id) {
    const f = FLATS[id], s = statusOf(id);
    tip.innerHTML = ''; const b = document.createElement('b'); b.textContent = f.name; const st = document.createElement('span'); st.className = 'st';
    st.textContent = floorName(f.floor) + (s ? ' · ' + STATUS[s][0] : ''); tip.append(b, st);
    tip.hidden = false; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px';
  } else tip.hidden = true;
});
renderer.domElement.addEventListener('pointerleave', () => { hover = null; tip.hidden = true; paint(); });
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY, performance.now()]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6 || performance.now() - down[2] > 500) return;
  const id = pick(e.clientX, e.clientY); open(id);
});
function fmtArea(v) { return v.toLocaleString('sk-SK', { maximumFractionDigits: 1 }) + ' m²'; }
function open(id) {
  picked = id; paint();
  if (!id) { $('card').hidden = true; return; }
  const f = FLATS[id], u = f.unit, s = statusOf(id);
  $('cMeta').textContent = f.kind + ' · ' + floorName(f.floor); $('cName').textContent = f.name;
  $('cArea').textContent = u && u.interior_area ? fmtArea(+u.interior_area) + (u.exterior_area ? ' + ' + fmtArea(+u.exterior_area) + ' vonku' : '') : f.area ? fmtArea(f.area) + ' (podľa pôdorysu)' : 'podľa cenníka';
  $('cPrice').textContent = u && u.price ? (+u.price).toLocaleString('sk-SK') + ' €' : 'podľa cenníka';
  $('cStatus').textContent = s ? STATUS[s][0] : 'údaje sa pripravujú';
  $('cStatus').style.background = css(s ? STATUS[s][1] : '--nodata'); $('cStatus').style.color = s === 'reserved' ? css('--zm-black') : '#fff'; $('cBand').style.background = css(s ? STATUS[s][1] : '--hi');
  $('cNote').textContent = u ? '' : 'Cena a dostupnosť sa sem načítajú z cenníka, keď bude byt zadaný v správe bytov.';
  $('cWalk').hidden = !f.walk; if (f.walk) $('cWalk').href = f.walk;
  $('card').hidden = false; $('hint').classList.add('gone');
}
$('cClose').addEventListener('click', () => open(null));
addEventListener('keydown', (e) => { if (e.key === 'Escape') open(null); });
controls.addEventListener('start', () => $('hint').classList.add('gone'));

// ---------------------------------------------------------------- rotation gizmo (corner; mouse and touch): drag inside it to
// orbit, or hold an arrow - left / right turn around building A, up / down tilt. The orange needle shows the heading.
const orb = $('orbit'), sph = new THREE.Spherical(), off3 = new THREE.Vector3();
function orbitBy(dTheta, dPhi) {
  off3.copy(camera.position).sub(controls.target); sph.setFromVector3(off3);
  sph.theta += dTheta; sph.phi = Math.min(controls.maxPolarAngle, Math.max(0.12, sph.phi + dPhi));
  off3.setFromSpherical(sph); camera.position.copy(controls.target).add(off3); camera.lookAt(controls.target);
  $('hint').classList.add('gone');
}
let held = null, heldT = 0, orbDrag = null, lastT = performance.now();
const STEP = { left: [0.9, 0], right: [-0.9, 0], up: [0, -0.5], down: [0, 0.5] };   // rad per second while held; a tap turns ~8°
orb.querySelectorAll('[data-k]').forEach((g) => {
  g.addEventListener('pointerdown', (e) => { e.stopPropagation(); held = g.dataset.k; heldT = performance.now(); orbitBy(...STEP[held].map((v) => v * 0.16)); g.querySelector('.arr').classList.add('on'); g.setPointerCapture(e.pointerId); });
  const off = () => { held = null; g.querySelector('.arr').classList.remove('on'); };
  g.addEventListener('pointerup', off); g.addEventListener('pointercancel', off); g.addEventListener('lostpointercapture', off);
});
orb.addEventListener('pointerdown', (e) => { if (held) return; orbDrag = [e.clientX, e.clientY]; orb.setPointerCapture(e.pointerId); });
orb.addEventListener('pointermove', (e) => {
  if (!orbDrag) return;
  orbitBy(-(e.clientX - orbDrag[0]) * 0.012, -(e.clientY - orbDrag[1]) * 0.008); orbDrag = [e.clientX, e.clientY];
});
const orbEnd = () => { orbDrag = null; };
orb.addEventListener('pointerup', orbEnd); orb.addEventListener('pointercancel', orbEnd);
function gizmoTick() {
  const now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (held && now - heldT > 180) orbitBy(...STEP[held].map((v) => v * dt));
  off3.copy(camera.position).sub(controls.target); sph.setFromVector3(off3);
  $('needle').setAttribute('transform', 'rotate(' + (-sph.theta * 180 / Math.PI).toFixed(1) + ')');
}

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { gizmoTick(); controls.update(); renderer.render(scene, camera); });
</script>
